name: Dependency remediation preview

on:
  push:
    branches:
      - review/deeper-consensus-hardening

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Remove unused vulnerable localtunnel dependency
        run: npm uninstall localtunnel
      - name: Apply compatible npm security updates
        shell: bash
        run: |
          npm audit fix
          npm pkg set 'overrides.solc.tmp=0.2.7'
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --json > npm-audit-after.json || true
          node -e "
            const pkg = require('./package.json');
            const lock = require('./package-lock.json');
            const audit = JSON.parse(require('fs').readFileSync('npm-audit-after.json', 'utf8'));
            const names = ['axios', 'localtunnel', 'proxy-addr', 'qs', 'tmp', 'solc'];
            for (const name of names) {
              const item = lock.packages['node_modules/' + name];
              console.log(JSON.stringify({ name, rootDependency: pkg.dependencies?.[name] || null, lockedVersion: item?.version || null }));
            }
            const totals = audit.metadata?.vulnerabilities || {};
            console.log('Audit after remediation:', JSON.stringify(totals));
            for (const [name, item] of Object.entries(audit.vulnerabilities || {})) {
              console.log(JSON.stringify({ package: name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable }));
            }
            if ((totals.high || 0) > 0 || (totals.critical || 0) > 0) {
              console.error('High/critical npm audit findings remain; refusing to commit dependency changes.');
              process.exit(1);
            }
          "
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -path './node_modules' -prune -o -name '*.js' -type f -print0)
      - name: Run unit tests
        run: npm test
      - name: Commit remediated dependency manifests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency manifest changes to commit."
          else
            git commit -m "chore: remediate npm audit findings [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload patched manifests for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-preview
          path: |
            package.json
            package-lock.json
            npm-audit-after.json
          if-no-files-found: warn
